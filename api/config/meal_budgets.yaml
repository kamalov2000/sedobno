# Доли дневной нормы калорий по приёмам пищи (бэклог п.3 «Дневник v2»).
#
# Зачем: дневник показывает у каждого приёма «съедено / бюджет», а бюджет — это доля
# дневной нормы пользователя (норма считается по профилю, см. internal/nutrition).
# Доли вынесены сюда, а не в код: это продуктовая настройка, её будем тюнить по
# фидбеку (кто-то не завтракает, кто-то ужинает плотно), и правка не должна требовать
# пересборки логики.
#
# Сумма долей должна давать 1.0 — иначе сумма бюджетов не сойдётся с дневной нормой,
# и пользователь увидит арифметику, которая не сходится. При нарушении сервер
# логирует предупреждение и берёт значения по умолчанию (те же, что ниже).
breakfast: 0.25
lunch: 0.35
dinner: 0.25
snack: 0.15
