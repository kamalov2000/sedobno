# Коэффициенты детерминированного скоринга (§5 SPEC). Тюнятся без изменения кода.
# Версия набора правил. Уезжает в ответ вместе с баллом: коэффициенты тюнятся без правки
# кода, и без версии нельзя сказать, по каким числам посчитан старый скан. Менять руками
# при любой правке коэффициентов ниже.
version: "2026-09-09b"

base: 100

# Вычеты по классу риска добавки (не-маркера) и потолок суммарного вычета по классу.
risk3_each: 25
risk3_cap: 50
risk2_each: 10
risk2_cap: 30
risk1_each: 3
risk1_cap: 9

# Спец-правила по маркерам (§5). Позиция считается от 1; top_positions = сколько
# первых позиций считаются «первыми» (сахар/соль в топ-N).
top_positions: 3
# Сахар по МЕСТУ в составе: первое / второе / третье. Состав печатают по убыванию массы,
# поэтому позиция — это и есть информация о количестве, которая у нас уже есть. Плоские
# −15 на весь топ уравнивали зефир (сахар первым, почти весь продукт) и сгущёнку (сахар
# третьим) — оба получали 85. Проверено на группе из 12 составов (docs/sugar_first_check.md).
sugar_pos: [25, 20, 15]
sugar_top: 15      # запасной вычет, если sugar_pos не задан (старые конфиги)
sugar_other: 5     # сахар дальше третьего места
transfat: 20       # маркеры трансжиров
palm: 5            # пальмовое масло
salt_top: 8        # соль в первых top_positions

# Наборы кодов-маркеров (slug из словаря, category="маркер").
transfat_markers: [hydrogenated_fat, partially_hydrogenated_fat, margarine]
palm_markers: [palm_oil, palm_olein]
sugar_markers: [sugar, glucose_fructose_syrup, invert_syrup, molasses, glucose_syrup, fructose, maltose_syrup, dextrose]
salt_markers: [salt]
