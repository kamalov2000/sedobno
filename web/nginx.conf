server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Кэширование статики SPA. Без явных заголовков вебвью Telegram кэширует
    # index.html эвристически и держит его через выкатки: 2026-07-20 бета обновилась,
    # файлы на диске были свежие, а тестер видел старый экран — пока не почистил кэш
    # руками. Просить об этом каждого тестера на каждой выкатке — не вариант.
    #
    # Стандартная для Vite пара: имена в /assets/ содержат хеш содержимого, поэтому
    # их можно кэшировать вечно (новая сборка = новое имя, коллизий нет). А вот
    # index.html — единственный файл с постоянным именем, и именно он указывает на
    # актуальные хеши, поэтому он не кэшируется никогда.
    # Только add_header, без expires: директива expires ставит СВОЙ Cache-Control,
    # и в ответе оказывалось два заголовка сразу — клиенты трактуют такое по-разному.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: любые пути отдаём index.html (маршрутизация на клиенте).
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
